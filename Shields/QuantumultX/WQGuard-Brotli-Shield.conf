; WQGuard · 防 Brotli 溢出降级护盾 (CVE-2026-111497 / HTTP2Shell) — Quantumult X 重写资源
; 针对 iOS 26.x 与 iOS 27.0–27.2.0 未修复之 libbrotli 堆越界写漏洞，剥离请求头 br 编码并拦截强推的恶意响应。
; 使用方式：在 Quantumult X「重写 -> 资源引用」中添加本文件链接或本地导入，并确保开启 MitM 与证书信任。

[rewrite_local]
; 1. 将客户端请求头中的 Accept-Encoding 强制降级为安全的 gzip, deflate
^https?://.+ url request-header (\r\n[Aa]ccept-[Ee]ncoding:).+(\r\n) request-header $1 gzip, deflate$2
; 2. 仅检查响应头（不解压响应体），阻断服务端强行返回的 Content-Encoding: br 数据流
^https?://.+ url script-response-header https://raw.githubusercontent.com/Kianuni/WQGuard/main/Shields/scripts/brotli-guard.js

[mitm]
hostname = -*.apple.com, -*.icloud.com, -*.icloud-content.com, -*.mzstatic.com, -*.cdn-apple.com, -guzzoni.apple.com, -*.siri.apple.com, -gspe1-ssl.ls.apple.com, -apple-relay.*, -cp4.cloudflare.com, -*.openai.com, -*.chatgpt.com, -*.binance.com, -*.okx.com, -*.tenpay.com, -*.alipay.com, *.xyz, *.top, *.icu, *.cyou, *.sbs, *.cfd, *.buzz, *.fun, *.click, *.link, *.site, *.online, *.shop, *.vip, *.pw, *.work, *.rest, *.monster, *.quest, *.zip, *.mov
